directories:
  output: artifacts/gui
  buildResources: .
productName: Aerofly_Startgeraet
fileAssociations:
  - ext:
      - tmc
      - mcf
      - fpl
      - pln
      - fms
win:
  target: portable
  signExecutable: false
  icon: assets/icons/windows/icon.ico
portable:
  artifactName: ${productName}-Windows.${ext}
mac:
  target: dmg
  artifactName: ${productName}-MacOS.${ext}
  icon: assets/icons/macos/icon.icns
linux:
  target:
    - AppImage
  executableArgs:
    - "--no-sandbox"
  artifactName: ${productName}-Linux.${ext}
  executableName: Aerofly_Startgeraet-Linux
  icon: assets/icons/linux/icons
  category: Utility
  desktop:
    entry:
      Name: Aerofly Startgerät
      Icon: Aerofly_Startgeraet-Linux
      StartupWMClass: Aerofly_Startgeraet-Linux
files: []
