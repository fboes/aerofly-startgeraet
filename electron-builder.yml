directories:
  output: artifacts/gui
  buildResources: .
productName: aerofly-startgeraet-gui
fileAssociations:
  - ext:
      - tmc
      - mcf
      - fpl
      - pln
      - fms
win:
  target: portable
  signExecutable: false
  icon: assets/icons/windows/icon.ico
portable:
  artifactName: ${productName}-windows.${ext}
mac:
  target: dmg
  artifactName: ${productName}-macos.${ext}
  icon: assets/icons/macos/icon.icns
linux:
  target:
    - AppImage
    - deb
  executableArgs:
    - "--no-sandbox"
  artifactName: ${productName}-linux.${ext}
  executableName: aerofly-startgeraet
  syncDesktopName: true
  icon: assets/icons/linux/icons
  category: Utility
  desktop:
    entry:
      Name: Aerofly Startgerät
      Icon: aerofly-startgeraet
      StartupWMClass: aerofly-startgeraet
deb:
  packageName: aerofly-startgeraet
files: []
